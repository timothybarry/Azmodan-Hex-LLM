[project]
name = "prompt-rag"
version = "0.1.0"
description = "Self-improving RAG system that turns rough requests into high-quality LLM prompts"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
prompt-rag = "prompt_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prompt_rag"]

[tool.setuptools.package-data]
prompt_rag = ["seeds/*.json"]
